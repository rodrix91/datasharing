name: Validate synthetic data handoff

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same PR or branch supersedes an unfinished run.
# Manual verification on master remains available from the Actions tab.
concurrency:
  group: handoff-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    name: Python standard library (${{ matrix.os }})
    # macOS hosted runners may spend the short timeout waiting for capacity.
    # Keep Linux/Windows bounded at 15m while allowing 30m for macOS allocation;
    # do not omit or relax any of the verification steps.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 30 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out preserved guide and independent companion example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Verify raw data, provenance and reproducible tidy output
        run: python examples/handoff/verify.py
      - name: Test negative and positive data handoff cases
        run: python -m unittest discover -s tests -v
